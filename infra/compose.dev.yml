# Local development Postgres. Local-only: the credentials are fictional and
# the port binds to 127.0.0.1.
#
#   docker compose -f infra/compose.dev.yml up -d --wait db
#   export DATABASE_URL=postgres://frontdesk:frontdesk@localhost:5432/frontdesk
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: frontdesk
      POSTGRES_PASSWORD: frontdesk
      POSTGRES_DB: frontdesk
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frontdesk"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  db-data:
