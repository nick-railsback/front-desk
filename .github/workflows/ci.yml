name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: frontdesk
          POSTGRES_PASSWORD: frontdesk
          POSTGRES_DB: frontdesk
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U frontdesk"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://frontdesk:frontdesk@localhost:5432/frontdesk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install gitleaks 8.30.0
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - name: Scan full history for secrets
        run: gitleaks git --redact --no-banner --verbose .
      - run: pnpm test
      - run: pnpm --filter ./app exec playwright install --with-deps chromium
      - run: pnpm test:e2e
